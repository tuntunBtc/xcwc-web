<style>
#bjd-review{--paper:light-dark(#f8f6f0,#232820);--white:light-dark(#fffefb,#30372b);--ink:light-dark(#374333,#eff1e6);--sub:light-dark(#717866,#b7c0ab);--line:light-dark(#e7e8dc,#434c3b);--sage:light-dark(#e9eddf,#3b4934);--green:light-dark(#536b48,#bdd5a9);--rust:light-dark(#a5663e,#e4ae84);--cream:light-dark(#f0e5d3,#514332);--on:light-dark(#fffef9,#24301f);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:22px 12px 18px;color-scheme:light dark}
#bjd-review *{box-sizing:border-box}#bjd-review button,#bjd-review input{font:inherit;color:inherit}#bjd-review button{border:0;background:transparent;cursor:pointer}#bjd-review button:disabled{opacity:.5;cursor:default}#bjd-review button:focus-visible,#bjd-review input:focus-visible{outline:3px solid var(--rust);outline-offset:3px}#bjd-review .reviewbar{max-width:670px;margin:0 auto 22px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}#bjd-review .reviewbar>span{font-size:11px;letter-spacing:2px;color:var(--sub)}#bjd-review #reviewnav{display:flex;flex-wrap:wrap;gap:5px}#bjd-review #reviewnav button{font-size:12px;padding:6px 10px;border-radius:9px;color:var(--sub)}#bjd-review #reviewnav button.active{background:var(--green);color:var(--on)}
#bjd-review .phone{width:min(100%,414px);margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:30px;position:relative;overflow:hidden;box-shadow:0 18px 70px #20321b13}#bjd-review .brandbar{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 15px;border-bottom:1px solid var(--line)}#bjd-review .brand{font-family:"Songti SC",serif;font-size:21px;letter-spacing:3px;padding:0}#bjd-review .brand small{font:9px/1 sans-serif;letter-spacing:2px;margin-left:5px;color:var(--sub)}#bjd-review .balance{background:var(--sage);padding:7px 11px;border-radius:30px;font-size:12px;color:var(--green)}#bjd-review main{padding:23px 22px 24px;min-height:650px}#bjd-review h1{font:500 29px/1.4 "Songti SC","STSong",serif;margin:5px 0 7px;letter-spacing:1px}#bjd-review h2{font:500 19px/1.5 "Songti SC",serif;margin:0}#bjd-review h3{font-size:14px;font-weight:500;margin:0}#bjd-review p{margin:6px 0;color:var(--sub);font-size:12px}#bjd-review .eyebrow{font-size:10px;letter-spacing:2px;color:var(--rust)}#bjd-review .between{display:flex;justify-content:space-between;align-items:center;gap:8px}#bjd-review .text{font-size:12px;color:var(--rust);padding:8px 0}#bjd-review .tag{display:inline-flex;background:var(--sage);color:var(--green);font-size:11px;padding:3px 8px;border-radius:6px}#bjd-review .muted{font-size:11px;color:var(--sub)}#bjd-review .primary{width:100%;padding:13px 15px;background:var(--green);color:var(--on);border-radius:13px;font-weight:500}#bjd-review .secondary{padding:11px 14px;border:1px solid var(--line);background:var(--white);border-radius:12px;font-size:12px}#bjd-review .section{margin-top:23px}#bjd-review .box{padding:16px;background:var(--white);border:1px solid var(--line);border-radius:17px;margin-top:12px}#bjd-review .row{display:flex;gap:9px;align-items:center}#bjd-review .row>*{flex:1;min-width:0}#bjd-review .bottom{display:flex;justify-content:space-around;padding:13px 12px 18px;border-top:1px solid var(--line);background:var(--white)}#bjd-review .bottom button{display:flex;align-items:center;flex-direction:column;gap:4px;font-size:11px;width:25%;color:var(--sub)}#bjd-review .bottom button.active{color:var(--green)}#bjd-review .bottom svg{width:21px;height:21px}#bjd-review .scene{height:275px;position:relative;background:linear-gradient(180deg,var(--sage),var(--paper));border-radius:140px 140px 20px 20px;margin-top:17px;overflow:hidden;text-align:center}#bjd-review .scene:before{content:"";position:absolute;width:150%;height:100px;bottom:-45px;left:-25%;border-radius:50%;background:var(--sage)}#bjd-review .scene .bubble{position:relative;z-index:2;display:inline-block;background:var(--white);padding:8px 15px;margin-top:19px;border-radius:12px;font-size:12px}#bjd-review .bird{display:block;width:211px;height:216px;object-fit:contain;mix-blend-mode:multiply;margin:auto}#bjd-review .bird-hit{position:relative;display:block;margin:0 auto;padding:0!important;touch-action:manipulation}#bjd-review .scene .bird-hit:active{transform:rotate(-6deg) scale(1.04)}#bjd-review .scenemark{position:absolute;bottom:15px;left:15px;letter-spacing:1px;color:var(--sub);font-size:10px}#bjd-review .float-action{position:absolute;right:12px;bottom:13px;background:var(--white);border-radius:11px;padding:8px 11px;font-size:11px}#bjd-review .stats{display:flex;gap:18px;margin:18px 0}#bjd-review .stats>div{flex:1;font-size:11px;color:var(--sub)}#bjd-review .track{height:5px;background:var(--line);border-radius:5px;margin-top:7px;overflow:hidden}#bjd-review .track i{height:100%;display:block;background:var(--green)}#bjd-review .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#bjd-review .actions button{padding:13px 2px;background:var(--white);border-radius:13px;font-size:11px;border:1px solid var(--line)}#bjd-review .actions svg{display:block;margin:0 auto 6px;width:20px;height:20px;color:var(--rust)}#bjd-review .banner{width:100%;text-align:left;background:var(--sage);padding:16px;border-radius:15px;margin-top:15px;display:flex;align-items:center;gap:12px}#bjd-review .banner span{flex:1}#bjd-review .banner small{display:block;color:var(--sub);font-size:11px;margin-top:4px}#bjd-review .pills{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}#bjd-review .pills button{padding:7px 12px;border-radius:20px;background:var(--white);font-size:12px;border:1px solid var(--line)}#bjd-review .pills button.selected{background:var(--green);color:var(--on);border-color:transparent}#bjd-review .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}#bjd-review .tile{padding:14px;background:var(--white);border:1px solid var(--line);border-radius:16px;text-align:left}#bjd-review .tile img{width:100%;height:125px;object-fit:contain;mix-blend-mode:multiply}#bjd-review .tile .art{height:110px;background:var(--sage);border-radius:12px;display:grid;place-items:center;font:40px/1 serif;margin-bottom:12px}#bjd-review .tile.selected{border-color:var(--green);background:var(--sage)}#bjd-review .tile p{font-size:11px}#bjd-review .map{height:230px;background:var(--sage);border-radius:18px;position:relative;margin-top:15px;overflow:hidden;background-image:linear-gradient(120deg,transparent 37%,var(--paper) 38%,var(--paper) 43%,transparent 44%),linear-gradient(30deg,transparent 45%,var(--paper) 46%,var(--paper) 51%,transparent 52%)}#bjd-review .map:before{content:"西湖";position:absolute;left:24%;top:26%;width:130px;height:120px;border-radius:47% 53% 38% 62%;background:light-dark(#d9e8e6,#385b59);display:grid;place-items:center;color:var(--sub);font-family:serif;letter-spacing:5px}#bjd-review .pin{position:absolute;background:var(--white);padding:8px 10px;border-radius:12px;box-shadow:0 4px 10px #20321b12;font-size:11px}#bjd-review .maplabel{position:absolute;bottom:10px;left:12px;font-size:10px;color:var(--sub)}#bjd-review .listrow{width:100%;text-align:left;padding:17px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px}#bjd-review .listrow:last-child{border:0}#bjd-review label{display:block;color:var(--sub);font-size:12px;margin:16px 0 7px}#bjd-review input[type=text]{width:100%;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;font-size:16px}#bjd-review .notice{padding:12px 14px;background:var(--cream);color:var(--rust);border-radius:12px;font-size:11px;margin-top:15px}#bjd-review .step{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--sub);margin:16px 0}#bjd-review .step b{background:var(--sage);padding:4px 9px;border-radius:50%;font-weight:500}#bjd-review .postcard{background:var(--white);padding:12px;border:1px solid var(--line);border-radius:15px;margin:15px 0}#bjd-review .postscene{height:290px;background:linear-gradient(155deg,var(--sage),var(--cream));border-radius:9px;position:relative;overflow:hidden;isolation:isolate}#bjd-review .postscene:before{content:"杭州\A 西湖来信";white-space:pre;position:absolute;left:22px;top:24px;font:26px/1.6 "Songti SC",serif;letter-spacing:4px;z-index:1}#bjd-review .postscene img.bg{position:absolute;width:100%;height:100%;object-fit:cover;z-index:0}#bjd-review .postscene .sticker{position:absolute;left:48%;top:35%;width:45%;height:auto;mix-blend-mode:multiply;z-index:2;touch-action:none;cursor:grab}#bjd-review .postfoot{display:flex;justify-content:space-between;padding:12px 4px 1px;font-size:10px;letter-spacing:1px}#bjd-review #bjd-toast{position:absolute;bottom:95px;left:20px;right:20px;background:var(--ink);color:var(--paper);padding:12px;border-radius:12px;text-align:center;font-size:12px;z-index:9}#bjd-review #bjd-modal{position:absolute;inset:0;z-index:10;background:#1d2a2255;display:flex;align-items:center;padding:23px}#bjd-review #bjd-modal[hidden]{display:none}#bjd-review .dialog{background:var(--paper);border-radius:22px;padding:23px;width:100%;box-shadow:0 20px 70px #17251522}#bjd-review .dialog .row{margin-top:20px}#bjd-review .reviewnote{max-width:414px;margin:17px auto 0;color:var(--sub);font-size:12px;line-height:1.8}#bjd-review .flock{display:flex;justify-content:center;flex-wrap:wrap;gap:0;margin:25px 0}#bjd-review .flock img{width:46%;mix-blend-mode:multiply}#bjd-review .emptyart{height:180px;display:grid;place-items:center;background:var(--sage);border-radius:90px 90px 16px 16px;font-size:66px;margin:20px 0}#bjd-review [hidden]{display:none!important}@media(max-width:420px){#bjd-review{padding:12px 0}#bjd-review .phone{border-radius:20px}#bjd-review main{padding:20px 17px}#bjd-review .brandbar{padding:18px 17px}#bjd-review .brand small{display:none}#bjd-review .reviewbar,#bjd-review .reviewnote{padding:0 12px}}@media(prefers-reduced-motion:reduce){#bjd-review *{transition:none!important}}

const note={home:'小窝 · 点小鸟触摸互动；连续轻点可体验炸毛反馈。每只小鸟独立保存状态。积分、补给和每日上限均为评审示例。',adopt:'认领 · 这里模拟 NFC／二维码已解析出产品凭证的落地页，不会读取手机 NFC。正式版需由服务端验证唯一凭证并处理重复绑定。',flock:'多鸟 · 同款的不同实物也分别建档。支持单只切换与同框照顾；此版所有鸟暂用原站造型占位，未代表最终首发名单。',city:'城市 · 景点位置仅为功能布局示意，不是地理导航；杭州已解锁，苏州演示锁定态。解锁来源为对应实体小鸟。',photo:'打卡 · 一期为照片＋静态角色贴纸，支持上传本地图片、拖动、缩放和生成分享卡。照片不离开浏览器；不包含 AI 合影、视频或定位核验。',wardrobe:'换装 · 羽力兑换和城市限定资格分开判断。服装为示意，正式角色需要各自的适配素材；不改动角色本体颜色来冒充换装。',shop:'商城 · 本期先提供实物橱窗与详情，不产生订单。价格、库存、支付与物流待确认；保留购买实物后认领的流程。',profile:'我的 · 统一承接羽力、补给和领养记录。H5 一期通过每日签到与互动获得奖励，微信步数暂不接入。'};
function save(){syncPet();try{window.openai?.setWidgetState({modelContent:{当前页面:pages.find(p=>p[0]===s.page)?.[1],羽力:s.points,城市:s.city,角色姓名:s.name},privateContent:s})?.catch(()=>{});}catch(e){}}

function dialog(title,body,action='',label='知道了'){modal.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}<div class="row">${btn('close','关闭')}${btn(action||'close',label,'primary')}</div></section>`;modal.hidden=false;modal.querySelector('button').focus();}
function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function home(){return `${head('A LITTLE HOME, A LITTLE JOY',`${esc(s.name)}的小日子`,'把日子过得软乎乎，把风景慢慢收藏。')}<div class="between"><span class="tag">杭州 · 参考角色　／　好奇、亲人</span>${go('flock','换一只 ↔','text')}</div><section class="scene"><div class="bubble" id="bird-speech">${s.wear?'新衣服真好看，陪我出门吧！':'今天也想，和你一起扑腾。'}</div><button class="bird-hit" data-do="touch" aria-label="轻摸小鸟的脑袋">${bird()}</button><span class="scenemark">杭州 · 江南小院</span>${btn('feather',s.feather?'羽毛已收集':'拾羽毛 ＋','float-action')}</section><div class="stats"><div><div class="between"><span>饱食</span><span>${s.hunger}%</span></div><div class="track"><i style="width:${s.hunger}%"></i></div></div><div><div class="between"><span>水分</span><span>${s.water}%</span></div><div class="track"><i style="width:${s.water}%"></i></div></div><div><div class="between"><span>心情</span><span>开心</span></div><div class="track"><i style="width:88%"></i></div></div></div><div class="actions">${[['feed','wheat','喂食'],['water','droplets','喂水'],['clean','sparkles','清洁'],['dress','shirt','换装']].map(([a,i,t])=>btn(a,ico(i)+t,'')).join('')}</div><div class="box between"><div><h3>今天的小补给</h3><p>签到领羽力，免费领谷粒和水</p></div>${btn('daily',s.daily?'已领取':'领取 ＋20','text')}</div>${go('photo',ico('camera')+'<span>把我放进你的风景里<small>上传照片 · 静态打卡 · 保存分享卡</small></span>↗','banner')}`;}
function adopt(){return `${head('NICE TO MEET YOU','以后，就一起走吧。','实体小鸟里，藏着一位等你认识的小伙伴。')}<div class="step"><b>1</b>碰一碰／扫码 → <b>2</b>确认身份 → <b>3</b>取名入住</div><div class="scene" style="height:225px">${bird()}<span class="scenemark">NFC / 二维码 · 领养凭证</span></div><div class="box"><div class="between"><h3>发现一只新伙伴</h3><span class="tag">演示凭证</span></div><p>参考角色 · 杭州 · 好奇、亲人</p><label for="adopt-status">凭证状态</label><select id="adopt-status" style="width:100%;padding:10px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px"><option value="ok">有效 · 尚未领养</option><option value="mine">已由我领养</option><option value="other">已被其他用户绑定</option><option value="invalid">凭证无效</option></select><label for="bird-name">给它取个名字</label><input id="bird-name" type="text" maxlength="12" placeholder="例如：卜叽" value="卜叽"><p>1～12 个字，之后也能修改。</p><div id="adopt-error" role="alert"></div>${btn('adopt','你好呀，带你回家','primary')}</div><p style="text-align:center;margin-top:15px">找不到 NFC？使用包装上的二维码进入。</p>`;}
function flock(){return `${head('YOUR LITTLE SANCTUARY','小伙伴，都在这里。','同一款小鸟，也有各自的名字和小脾气。')}<div class="pills">${btn('single','单只陪伴',s.group?'':'selected')}${btn('group','一起同框',s.group?'selected':'')}</div>${s.group?`<div class="box"><div class="flock">${bird('')}${bird('')}</div><h3>卜叽与小桂的午后</h3><p>同框演示 · 照顾当前 2 只小鸟</p><div class="row">${btn('allfeed','一起喂食')}${btn('allwater','一起喂水')}</div></div>`:`<div class="grid">${s.pets.map((p,i)=>{const n=p.name;return `<button class="tile ${s.bird===i?'selected':''}" data-bird="${i}">${bird('')}<h3>${esc(n)}</h3><p>${i===1?'桂花鸟':'同款角色'} · 杭州</p><span class="muted">独立编号 BJD-000${i+1}</span></button>`;}).join('')}</div>`}<div class="section">${go('adopt','＋ 领养另一只小伙伴','primary')}</div><div class="notice">以上为多鸟布局示例；正式首发款式与城市归属待产品资料确认。</div>`;}
function city(){const lock=s.city==='苏州';return `${head('COLLECT A CITY, KEEP A MEMORY','带着小鸟，逛一座城。','每一座故乡，都有新的风景等你。')}<div class="pills">${['杭州','苏州'].map(c=>`<button data-city="${c}" class="${s.city===c?'selected':''}">${c} ${c==='苏州'?'· 未解锁':'· 已解锁'}</button>`).join('')}</div>${lock?`<div class="emptyart">❀</div><h2>一只苏州小鸟，一座江南园林。</h2><p>领养对应实体小鸟，即可解锁苏州景点与限定装扮。</p><div class="section">${go('shop','看看苏州的小伙伴','primary')}</div><div class="box"><h3>城市限定预告</h3><p>园林景点 · 苏式旗袍 · 城市分享卡</p></div>`:`<div class="between"><h2>杭州城市手册</h2><span class="tag">已打卡 ${s.checked?1:0} / 3</span></div><div class="map" aria-label="杭州景点功能示意图"><button data-spot="断桥残雪" class="pin" style="top:24px;right:20px">◎ 断桥残雪</button><button data-spot="花港观鱼" class="pin" style="bottom:48px;left:17px">◎ 花港观鱼</button><button data-spot="雷峰夕照" class="pin" style="bottom:27px;right:15px">◎ 雷峰夕照</button><span class="maplabel">功能布局示意 · 非导航地图</span></div><div class="box between"><div><h3>断桥残雪</h3><p>${s.checked?'已完成演示打卡':'拍一张照，把今天留在西湖'}</p></div>${go('photo',s.checked?'再去看看':'去打卡 →','text')}</div><div class="section between"><h2>这座城的限定礼物</h2>${go('wardrobe','查看全部 →','text')}</div><div class="box between"><div><span class="tag">杭州限定</span><h3 style="margin-top:7px">小青 · 西湖游记</h3><p>城市打卡解锁资格，羽力兑换</p></div>${go('wardrobe','去看看','secondary')}</div>`}`;}
function photoPage(){return `${head('A POSTCARD WITH YOU','今天，和小鸟同框。','选一张照片，留下一次小小同行。')}<div class="pills"><button class="${photo?'':'selected'}" data-do="preset">西湖预设</button>${btn('upload','上传我的照片',photo?'selected':'')}</div><input id="bjd-photo-file" type="file" accept="image/*" hidden><div class="postcard"><div class="postscene" id="postscene">${photo?`<img class="bg" src="${photo}" alt="用户选择的本地照片">`:''}${bird('sticker')}</div><div class="postfoot"><span>卜叽岛 · 和你一起的风景</span><span>HANGZHOU</span></div></div><div class="between"><span class="muted">拖动小鸟调整位置</span><span class="tag">静态贴纸</span></div><label for="sticker-size">小鸟大小</label><input id="sticker-size" type="range" min="20" max="65" value="${size}" style="width:100%;accent-color:var(--green)"><div class="section row">${btn('checkin',s.checked?'已打卡':'完成演示打卡')}${btn('export','生成分享卡','primary')}</div><div class="notice">演示打卡奖励 ＋30 羽力，每次仅领取一次。城市归属及正式核验规则待确认。</div><p>AI 自拍合影与视频打卡留待后续版本。</p>`;}
function wardrobe(){return `${head('DRESS FOR A LITTLE ADVENTURE','换个心情，再出门。','把收集到的羽力，变成小鸟的新装扮。')}<div class="box between"><span>可用羽力</span><span style="color:var(--rust)">✦ ${s.points}</span></div><div class="grid"><button class="tile" data-do="basicwear"><div class="art">◌</div><h3>日常小斗笠</h3><p>初始装扮 · 已拥有</p><span class="tag">${s.wear?'点击穿戴':'已穿戴'}</span></button><button class="tile" data-do="outfit"><div class="art">❧</div><h3>小青 · 西湖游记</h3><p>杭州限定 · 100 羽力</p><span class="tag">${s.owned?(s.wear?'已穿戴':'点击穿戴'):(s.checked?'可兑换':'需完成城市打卡')}</span></button><button class="tile" data-do="suzhou"><div class="art">❀</div><h3>苏式旗袍</h3><p>苏州限定 · 尚未解锁</p><span class="tag">领养苏州小鸟解锁</span></button></div><div class="notice">服装卡片与穿戴反馈为交互示意，最终效果需对应角色服装素材。</div>`;}
function shop(){return `${head('LITTLE THINGS, LOVELY DAYS','把一座城，带回家。','薪承文化 · 一份软乎乎的城市记忆。')}<div class="banner"><span><h2>带一位新伙伴回家</h2><small>买实体小鸟 → 签收 → 碰一碰认领</small></span>${ico('gift')}</div><div class="pills">${['毛绒小鸟','城市好物'].map(c=>`<button data-cat="${c}" class="${s.category===c?'selected':''}">${c}</button>`).join('')}</div><div class="grid">${(s.category==='毛绒小鸟'?['桂花鸟','白头高洁','荷花鸟','园林鸟']:['城市冰箱贴','城市钥匙扣']).map((n,i)=>`<button class="tile" data-product="${n}">${s.category==='毛绒小鸟'?bird(''):'<div class="art">✿</div>'}<span class="tag">${i===3?'苏州系列':'城市系列'}</span><h3 style="margin-top:7px">${n}</h3><p>款式／规格／价格待确认</p><span class="muted">查看详情 ↗</span></button>`).join('')}</div><div class="notice">实物橱窗 · 当前不提供支付和下单。示例款式暂用参考站角色占位。</div>`;}
function profile(){return `${head('OUR LITTLE STORY','关于我们的小日子。','不赶路，一起走。')}<div class="box between"><div><h2>${esc(s.name)}</h2><p>杭州 · 已领养 ${s.pets.length} 只示例伙伴</p>${btn('rename','改个名字 ↗','text')}</div>${bird('') .replace('class=""','style="width:110px;height:120px;object-fit:contain;mix-blend-mode:multiply"')}</div><div class="box"><button class="listrow" data-do="points"><span>✦ 我的羽力</span><span>${s.points} →</span></button><button class="listrow" data-go="flock"><span>我的小伙伴</span><span>${s.pets.length} 只 →</span></button><button class="listrow" data-go="wardrobe"><span>我的衣橱</span><span>→</span></button><button class="listrow" data-do="daily"><span>每日签到与补给</span><span>${s.daily?'已领取':'领取 →'}</span></button><button class="listrow" data-do="steps"><span>微信步数兑换</span><span class="muted">后续版本</span></button><button class="listrow" data-go="adopt"><span>实体小鸟认领</span><span>→</span></button></div><p style="text-align:center;margin-top:25px;letter-spacing:3px">卜叽岛 BUJIDAO</p>`;}
function render(){if(!pages.some(p=>p[0]===s.page))s.page='home';content.innerHTML=({home,adopt,flock,city,photo:photoPage,wardrobe,shop,profile}[s.page])();root.querySelector('#balance').textContent=s.points;root.querySelector('#reviewnav').innerHTML=pages.map(([p,t])=>`<button data-go="${p}" class="${s.page===p?'active':''}">${t}</button>`).join('');const active=['adopt','flock','wardrobe'].includes(s.page)?'home':s.page==='photo'?'city':s.page;root.querySelector('.bottom').innerHTML=[['home','house','小窝'],['city','map','城市'],['shop','shopping-bag','商城'],['profile','user-round','我的']].map(([p,i,t])=>`<button data-go="${p}" class="${active===p?'active':''}" ${active===p?'aria-current="page"':''}>${ico(i)}${t}</button>`).join('');root.querySelector('#reviewnote').textContent=note[s.page];if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});if(s.page==='photo')bindPhoto();}
function nav(p){s.page=p;modal.hidden=true;render();save();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){nav(b.dataset.go);return;}if(b.dataset.bird!==undefined){syncPet();s.bird=+b.dataset.bird;Object.assign(s,s.pets[s.bird]);nav('home');toast('已切换到 '+s.name);return;}if(b.dataset.city){s.city=b.dataset.city;render();save();return;}if(b.dataset.cat){s.category=b.dataset.cat;render();return;}if(b.dataset.spot){dialog(b.dataset.spot,'<p>打开景点详情，查看预设风景和可领取奖励。</p><p>一期可用静态照片打卡，正式规则待确认。</p>','visit','去打卡');return;}if(b.dataset.product){dialog(b.dataset.product,`<div style="text-align:center">${bird()}</div><p>示例款式，形象、城市归属、规格与价格待确认。</p><p>购买实体并签收后，碰一碰 NFC 或扫描包装二维码，即可解锁对应伙伴。</p><div class="notice">商城一期仅展示；支付、订单、物流待确认。</div>`,'demoentry','体验签收后认领');return;}
const a=b.dataset.do;if(!a)return;
if(a==='close'){modal.hidden=true;return;}if(a==='visit'){nav('photo');return;}if(a==='demoentry'){nav('adopt');return;}
if(a==='adopt'){const status=root.querySelector('#adopt-status').value;const n=root.querySelector('#bird-name').value.trim();if(status==='mine'){nav('home');toast('这是你已领养的小鸟，回小窝看看吧');return;}if(status!=='ok'){root.querySelector('#adopt-error').innerHTML=`<p style="color:var(--rust)">${status==='other'?'该小鸟已被其他用户绑定，请核对包装或联系客服。':'凭证无效，请重新扫码或核对包装。'}</p>`;return;}if(!n){root.querySelector('#adopt-error').textContent='先给小鸟取个名字吧。';return;}syncPet();s.pets.push({name:n,hunger:65,water:78});s.bird=s.pets.length-1;s.name=n;s.hunger=65;s.water=78;nav('home');toast('认领演示完成，'+n+'入住啦');return;}
if(a==='touch'){s.touches++;if(s.touches%4===0){root.querySelector('#bird-speech').textContent='哎呀，轻一点！小鸟要炸毛啦。';toast('摸得太频繁啦，稍微歇一会儿');}else{root.querySelector('#bird-speech').textContent='摸摸头，今天的好心情是你给的！';if(!s.interactionReward){s.points+=5;s.interactionReward=true;root.querySelector('#balance').textContent=s.points;toast('首次互动 ＋5 羽力');}}save();return;}
if(['feed','water','clean','feather','daily','allfeed','allwater'].includes(a)){if(a==='allfeed'){s.pets.slice(0,2).forEach(p=>p.hunger=Math.min(100,p.hunger+20));if(s.bird<2)s.hunger=s.pets[s.bird].hunger;}if(a==='allwater'){s.pets.slice(0,2).forEach(p=>p.water=Math.min(100,p.water+20));if(s.bird<2)s.water=s.pets[s.bird].water;}if(a==='feed'||a==='allfeed'){s.hunger=Math.min(100,s.hunger+(a==='allfeed'?0:20));toast(a==='allfeed'?'已为同框的 2 只小鸟添加谷粒':'吃饱一点，开心多一点');}if(a==='water'||a==='allwater'){s.water=Math.min(100,s.water+(a==='allwater'?0:20));toast(a==='allwater'?'已为同框的 2 只小鸟添水':'咕嘟咕嘟，喝到清水啦');}if(a==='clean'){if(s.clean)toast('小窝已经干干净净啦');else{s.clean=true;s.points+=5;toast('清洁小窝 ＋5 羽力');}}if(a==='feather'){if(s.feather)toast('羽毛已经收好啦');else{s.feather=true;s.points+=10;toast('收集羽毛 ＋10 羽力');}}if(a==='daily'){if(s.daily)toast('今天已经领取，明天再来');else{s.daily=true;s.points+=20;toast('签到 ＋20 羽力，补给已领取');}}render();save();return;}
if(a==='single'||a==='group'){s.group=a==='group';render();save();return;}if(a==='dress'){nav('wardrobe');return;}
if(a==='checkin'){if(s.checked){toast('本次打卡奖励已领取');return;}s.checked=true;s.points+=30;render();save();toast('演示打卡完成 ＋30 羽力');return;}
if(a==='outfit'){if(!s.checked){dialog('先收集一段西湖记忆','<p>完成一次杭州城市打卡，再来兑换小青装扮。</p>','visit','去打卡');return;}if(!s.owned){if(s.points<100){toast('羽力还差 '+(100-s.points)+'，去签到或互动吧');return;}dialog('兑换小青 · 西湖游记','<p>消耗 100 羽力，兑换后可反复穿戴。</p>','redeem','确认兑换');return;}s.wear=true;render();save();toast('已穿戴 · 服装视觉待素材适配');return;}
if(a==='redeem'){if(!s.owned&&s.points>=100){s.points-=100;s.owned=true;s.wear=true;}modal.hidden=true;render();save();toast('兑换成功，已记录穿戴状态');return;}if(a==='basicwear'){s.wear=false;render();save();toast('已换回日常小斗笠');return;}if(a==='suzhou'){s.city='苏州';nav('city');return;}
if(a==='points'){dialog('羽力，让陪伴有回响',`<p>当前羽力：${s.points}</p><p>示例来源：首次互动 ＋5、拾羽毛 ＋10、清洁 ＋5、每日签到 ＋20、照片打卡 ＋30。</p><p>示例消耗：城市装扮兑换 100。基础喂食喂水使用免费补给，是否额外消耗积分待确认。</p><div class="notice">以上分值、每日上限及防刷规则为设计建议。</div>`);return;}
if(a==='steps'){dialog('让脚步，变成小小心意','<p>微信步数属于后续版本功能。本期手机网页版使用每日签到与互动领取奖励。</p>');return;}
if(a==='rename'){dialog('给小鸟换个名字',`<label for="rename-input">1～12 个字</label><input type="text" id="rename-input" maxlength="12" value="${esc(s.name)}">`,'savename','保存名字');return;}if(a==='savename'){const n=root.querySelector('#rename-input').value.trim();if(!n){toast('名字还没填呢');return;}s.name=n;modal.hidden=true;render();save();return;}
if(a==='upload'){root.querySelector('#bjd-photo-file').click();return;}if(a==='preset'){photo='';render();return;}if(a==='export'){dialog('这张风景，属于你们。',`<div class="postcard"><div class="postscene">${photo?`<img class="bg" src="${photo}" alt="本地照片">`:''}${bird('sticker').replace('class="sticker"',`class="sticker" style="left:${drag.x}%;top:${drag.y}%;width:${size}%"`)}</div><p>${esc(s.name)}与你的小小同行</p><div class="postfoot">卜叽岛 BUJIDAO · 城市记忆</div></div><p>分享卡包含角色、景点标识与品牌。点击保存导出 PNG。</p>`,'download','保存分享卡');return;}if(a==='download')exportCard();
});
function bindPhoto(){const file=root.querySelector('#bjd-photo-file');file.onchange=()=>{const f=file.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('请选择图片文件');return;}if(photo)URL.revokeObjectURL(photo);photo=URL.createObjectURL(f);render();};const sticker=root.querySelector('.sticker'),stage=root.querySelector('#postscene');function pos(){sticker.style.left=drag.x+'%';sticker.style.top=drag.y+'%';sticker.style.width=size+'%';}pos();root.querySelector('#sticker-size').oninput=e=>{size=+e.target.value;drag.x=Math.min(drag.x,100-size);pos();};sticker.onpointerdown=e=>{e.preventDefault();sticker.setPointerCapture(e.pointerId);const rect=stage.getBoundingClientRect(),ox=e.clientX-rect.left-drag.x/100*rect.width,oy=e.clientY-rect.top-drag.y/100*rect.height;sticker.onpointermove=ev=>{drag.x=Math.max(0,Math.min(100-size,(ev.clientX-rect.left-ox)/rect.width*100));drag.y=Math.max(0,Math.min(100-sticker.offsetHeight/rect.height*100,(ev.clientY-rect.top-oy)/rect.height*100));pos();};sticker.onpointerup=()=>sticker.onpointermove=null;sticker.onpointercancel=()=>sticker.onpointermove=null;};}
async function exportCard(){try{const canvas=document.createElement('canvas');canvas.width=720;canvas.height=920;const c=canvas.getContext('2d');c.fillStyle='#fffdf6';c.fillRect(0,0,720,920);const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});c.fillStyle='#e8eddf';c.fillRect(30,30,660,730);if(photo){const img=await load(photo);const scale=Math.max(660/img.width,730/img.height);c.save();c.beginPath();c.rect(30,30,660,730);c.clip();c.drawImage(img,30+(660-img.width*scale)/2,30+(730-img.height*scale)/2,img.width*scale,img.height*scale);c.restore();}else{c.fillStyle='#536b48';c.font='42px serif';c.fillText('杭州 · 西湖来信',65,110);}const img=await load(asset);c.save();c.globalCompositeOperation='multiply';const w=660*size/100;c.drawImage(img,30+660*drag.x/100,30+730*drag.y/100,w,w*img.height/img.width);c.restore();c.fillStyle='#374333';c.font='28px sans-serif';c.fillText(s.name+'与你的小小同行',42,815);c.font='20px sans-serif';c.fillText('卜叽岛 BUJIDAO · 城市记忆',42,865);const a=document.createElement('a');a.download='卜叽岛-城市分享卡.png';a.href=canvas.toDataURL('image/png');a.click();toast('分享卡已生成，浏览器将保存 PNG');}catch(e){toast('保存失败，请更换图片后重试');}}
render();
if(globalThis.Tweak){const style={radius:30};new Tweak({container:root.querySelector('.phone'),onChange:()=>{root.querySelector('.phone').style.borderRadius=style.radius+'px';}}).addSlider(style,'radius',{label:'页面圆角',min:8,max:34,unit:'px'});}
})();
</script>
