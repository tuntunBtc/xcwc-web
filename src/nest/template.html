<main class="nest" id="nest"><img class="scene" src="assets/nest/felt/home-background.png" alt="毛绒森林与湖畔草地，树拱下挂着粉色灯笼"><div class="scene-shade"></div>
<header class="hud"><div class="identity"><button class="avatar" data-action="switch" aria-label="切换小鸟"><img src="assets/nest/felt/emotions/happy-192.webp" width="192" height="174" decoding="async" alt=""></button><div class="identity-text"><button class="name" data-action="rename"><strong id="name">加载中</strong><span aria-hidden="true">✎</span></button><small>⌖ 我的小窝</small></div><span class="companion-mark" aria-hidden="true">🌸<small>相伴</small></span><button class="switch" data-action="switch" aria-label="查看和切换小鸟">›</button></div><button class="wallet" data-action="points" aria-label="查看叽分钱包"><i class="prop feather" aria-hidden="true">🪶</i><span><b id="points">—</b><small>叽分</small></span><span class="wallet-plus" aria-hidden="true">＋</span></button></header>
<section class="status" aria-label="当前小鸟状态"><div class="stat"><span><em aria-hidden="true">🥣</em> 饱食 <b id="hunger">—</b></span><i><u id="hunger-bar"></u></i></div><div class="stat water"><span><em aria-hidden="true">💧</em> 水分 <b id="water">—</b></span><i><u id="water-bar"></u></i></div><div class="stat mood"><span><em aria-hidden="true">♥</em> 心情 <b id="mood">—</b></span><i><u id="mood-bar"></u></i></div></section>
<nav class="tools" aria-label="小窝工具"><button data-action="clean"><i class="prop p0"></i><span>清洁</span></button><button data-action="daily" id="daily"><i class="prop p1"></i><span>补给</span><u class="dot"></u></button><button data-action="checkin" class="checkin-tool"><i class="prop p2"></i><span>合照打卡</span></button><button data-action="dress"><i class="prop p3"></i><span>换装</span></button><button data-action="play" hidden aria-label="逗逗小鸟，看看好奇的表情"><i class="play-prop" aria-hidden="true">?</i><span>逗逗</span></button></nav>
<div class="needs" aria-label="小鸟现在的需要"><button data-need="water" data-action="water" aria-label="想喝水，点击添水" hidden>想喝水</button><button data-need="food" data-action="feed" aria-label="肚子饿了，点击喂食" hidden>肚子饿了</button><button data-need="company" data-action="touch" aria-label="想你陪陪，点击摸摸" hidden>想你陪陪</button></div>
<div class="speech" role="status" aria-live="polite" id="speech">阳光正好，<br>陪我待一会儿吧～ <span>♥</span></div>
<button class="claim-help" data-action="claim-help" hidden>如何领取小鸟</button>
<div class="actor"><div class="shadow"></div><button id="bird" data-action="touch" aria-label="摸摸当前小鸟"><img src="assets/nest/felt/emotions/happy.webp" width="640" height="580" fetchpriority="high" alt="戴着绿叶冠的毛绒小黄莺"></button><svg class="grass-contact" viewBox="0 0 200 24" preserveAspectRatio="none" aria-hidden="true" focusable="false"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#7b934c" stroke-width="3" opacity=".58"><path d="M48 22 Q48 17 43 14 M53 22 Q55 16 52 10 M59 22 Q60 17 65 13 M65 22 Q68 18 73 17"/><path d="M127 22 Q127 18 122 15 M134 22 Q132 17 136 11 M140 22 Q141 16 146 10 M147 22 Q149 18 154 16"/></g><g stroke="#b8cd83" stroke-width="1.5" opacity=".9"><path d="M49 21 Q49 17 46 15 M55 21 Q56 16 54 12 M62 21 Q64 18 68 16 M130 21 Q130 18 127 16 M138 21 Q138 16 142 12 M145 22 Q147 18 151 17"/></g></g></svg><span class="hearts" aria-hidden="true">♡</span><span class="thirst-drops" aria-hidden="true">💧</span><div class="emotion-portrait" hidden><img width="640" height="580" decoding="async" alt=""><span></span></div><span class="emotion-label" hidden></span><button class="emotion-retry" data-action="retry-expression" hidden>重试小表情</button></div>

<div class="dock"><button data-action="feed"><i class="prop p5"></i><span>喂食 <b>›</b></span></button><button data-action="water"><i class="prop p6"></i><span>添水 <b>›</b></span></button><button data-action="touch"><i class="prop p7"></i><span>摸摸 <b>›</b></span></button></div>
</main><dialog id="sheet"><div class="sheet-handle"></div><button class="close" data-action="close" aria-label="关闭">×</button><div id="sheet-content"></div></dialog>
