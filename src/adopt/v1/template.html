<section class="adopt-v1" aria-label="碰一碰领养小鸟">
  <div class="scene" role="group" aria-label="城市小鸟领养插画">
    <img class="scene-art" src="assets/adopt-v1/felt/scene-900.webp" alt="毛绒小黄莺从印着西湖塔景的蛋壳中探出身子，身后是垂柳、湖水与暖色灯笼。" fetchpriority="high" width="900" height="675">
    <img class="scene-status-cleanup" src="assets/adopt-v1/felt/status-cleanup-324.webp" alt="" aria-hidden="true" width="324" height="68">
    <button class="hit back" type="button" data-action="back" aria-label="返回小窝"></button>
    <h1 class="scene-title">领养你的<br>城市小鸟</h1>
    <p class="scene-subtitle" data-role="subtitle">一场相遇，正在等待确认</p>

    <section class="scroll-card" aria-label="小鸟公开资料">
      <h2 data-role="bird-name">等待识别</h2>
      <p class="bird-city"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22s8-8.5 8-14A8 8 0 0 0 4 8c0 5.5 8 14 8 14Z" fill="currentColor"/><circle cx="12" cy="8" r="3" fill="#fff0da"/></svg><span data-role="city-line">城市资料待确认</span></p>
      <p class="scroll-detail"><span data-role="type">款式待确认</span><br><span data-role="skin">出厂肤色待确认</span></p>
    </section>

    <div class="trait-row" role="group" aria-label="性格档案">
      <span class="trait-label">性格<br>档案</span>
      <span class="trait-pill trait-one" data-role="trait-one">温柔治愈</span>
      <span class="trait-pill trait-two" data-role="trait-two">热爱旅行</span>
      <span class="trait-pill trait-three" data-role="trait-three">好奇探索</span>
    </div>
  </div>
  <div class="adoption-feedback">
    <p class="service-notice" data-role="service-notice" role="status" aria-live="polite" hidden></p>
    <button class="read-retry" type="button" data-action="retry" hidden>重新读取小鸟资料</button>
  </div>
  <div class="adoption-details">
    <form class="name-form" novalidate>
      <label class="name-heading" for="adopt-v1-name"><span class="chick" aria-hidden="true">🐤</span>给小鸟取个名字吧～</label>
      <div class="name-field">
        <input id="adopt-v1-name" name="nickname" autocomplete="off" placeholder="请输入 1–6 个字" disabled>
        <button class="random-name" type="button" data-action="random" aria-label="随机取名" disabled><span aria-hidden="true">⚄</span><span>随机取名</span></button>
      </div>
      <p class="validation" role="alert" hidden></p>
      <button class="adopt-button" type="button" data-action="confirm" disabled>孵化并领养</button>
      <p class="action-note" data-role="action-note">读取实体资料后继续</p>
    </form>
  </div>

  <dialog class="login-dialog" aria-labelledby="adopt-v1-login-title">
    <button class="dialog-close" type="button" data-action="close-login" aria-label="关闭登录框">×</button>
    <span class="dialog-eyebrow">让相遇有个归处</span><h2 id="adopt-v1-login-title">登录，把它带回小窝。</h2>
    <p>登录后会回到这只小鸟的页面，你填写的名字也会保留。</p>
    <form class="login-form">
      <label for="adopt-v1-username">账号</label><input id="adopt-v1-username" name="username" autocomplete="username" pattern="[a-z0-9_]{4,32}" minlength="4" maxlength="32" required>
      <label for="adopt-v1-password">密码</label><input id="adopt-v1-password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="72" required>
      <p class="login-error" role="alert"></p>
      <button class="dialog-primary" type="button" value="login">登录并返回</button>
      <button class="dialog-secondary" type="button" value="register">注册并登录</button>
    </form>
  </dialog>
</section>
