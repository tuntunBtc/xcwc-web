<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>访问统计后台 · 啾游记</title>
  <style>
    :root{color-scheme:light;--ink:#29372c;--muted:#718071;--line:#dfe7dc;--paper:#f7f8f3;--green:#597548;--soft:#e8efdf}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(1100px,100% - 32px);margin:32px auto 64px}h1,h2,p{margin-top:0}h1{font-size:28px}h2{font-size:18px;margin-bottom:12px}
    .sub{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #273a2410}
    .row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px}.field label{font-size:13px;color:var(--muted)}input,button{font:inherit;border-radius:10px;padding:10px 12px}input{border:1px solid var(--line);min-height:43px}button{border:0;background:var(--green);color:white;cursor:pointer;min-height:43px}button.secondary{background:var(--soft);color:var(--ink)}
    #status{min-height:24px;color:#9a4a31}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{padding:16px;border-radius:12px;background:var(--soft)}.metric small{display:block;color:var(--muted)}.metric strong{font-size:28px}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}td.agent{max-width:650px;overflow-wrap:anywhere;color:#526252}
    @media(max-width:600px){main{width:calc(100% - 20px);margin:20px auto}.card{padding:14px}.metrics{grid-template-columns:1fr 1fr}table{font-size:12px}th,td{padding:8px 5px}}
  </style>
</head>
<body>
<main>
  <h1>啾游记 · 访问统计</h1>
  <p class="sub">按北京时间统计访次与页面浏览量。后台密钥仅在当前页面内存使用；UA 记录保留 90 天，不采集 IP。</p>
  <section class="card" aria-label="后台访问">
    <div class="row">
      <div class="field" style="flex:1;min-width:240px"><label for="admin-token">后台密钥</label><input id="admin-token" type="password" autocomplete="off" placeholder="输入服务器配置的统计后台密钥"></div>
      <button id="connect" type="button">查看统计</button>
    </div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <section class="card">
    <div class="row">
      <div class="field"><label for="from">开始日期</label><input id="from" type="date"></div>
      <div class="field"><label for="to">结束日期</label><input id="to" type="date"></div>
      <button id="refresh" class="secondary" type="button">刷新</button>
    </div>
    <div class="metrics" style="margin-top:16px">
      <div class="metric"><small>访次（按标签页会话去重）</small><strong id="visits">—</strong></div>
      <div class="metric"><small>页面浏览量（PV）</small><strong id="page-views">—</strong></div>
    </div>
  </section>
  <section class="card"><h2>每日访问</h2><div style="overflow:auto"><table><thead><tr><th>日期</th><th>访次</th><th>页面浏览量</th></tr></thead><tbody id="daily"></tbody></table></div></section>
  <section class="card"><h2>页面访问量</h2><div style="overflow:auto"><table><thead><tr><th>页面</th><th>浏览量</th></tr></thead><tbody id="pages"></tbody></table></div></section>
  <section class="card"><h2>最近 UA（最多 100 条）</h2><div style="overflow:auto"><table><thead><tr><th>时间</th><th>页面</th><th>User-Agent</th></tr></thead><tbody id="agents"></tbody></table></div></section>
</main>
<script>
(()=>{
 const names={home:'小窝',city:'城市',shop:'商城',profile:'我的',adopt:'领养页',photo:'合照打卡',wardrobe:'衣橱',flock:'小鸟列表'};
 const $=id=>document.getElementById(id),status=$('status');let token='';
 const dateString=value=>{const d=new Date(value);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
 const today=new Date(),week=new Date(today);week.setDate(today.getDate()-6);$('from').value=dateString(week);$('to').value=dateString(today);
 function cell(row,value,className=''){const td=document.createElement('td');td.textContent=value;if(className)td.className=className;row.append(td)}
 async function load(){
  token=$('admin-token').value.trim();if(!token){status.textContent='请输入后台密钥。';return}
  status.textContent='正在读取…';
  try{
   const query=new URLSearchParams({from:$('from').value,to:$('to').value});
   const response=await fetch('/api/admin/analytics?'+query,{headers:{Authorization:'Bearer '+token},cache:'no-store'});
   const data=await response.json();if(!response.ok)throw Error(data.message||'读取失败');
   $('visits').textContent=data.daily.reduce((sum,item)=>sum+item.visits,0).toLocaleString();
   $('page-views').textContent=data.daily.reduce((sum,item)=>sum+item.pageViews,0).toLocaleString();
   const daily=$('daily');daily.replaceChildren();for(const item of data.daily){const tr=document.createElement('tr');cell(tr,item.date);cell(tr,item.visits.toLocaleString());cell(tr,item.pageViews.toLocaleString());daily.append(tr)}
   const pages=$('pages');pages.replaceChildren();for(const item of data.pages){const tr=document.createElement('tr');cell(tr,names[item.page]||item.page);cell(tr,item.pageViews.toLocaleString());pages.append(tr)}
   const agents=$('agents');agents.replaceChildren();for(const item of data.recentAgents){const tr=document.createElement('tr');cell(tr,new Date(item.viewedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}));cell(tr,names[item.page]||item.page);cell(tr,item.userAgent,'agent');agents.append(tr)}
   status.textContent='已更新';
  }catch(error){status.textContent=error.message}
 }
 $('connect').addEventListener('click',load);$('refresh').addEventListener('click',load);
})();
</script>
</body>
</html>
